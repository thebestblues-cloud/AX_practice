<title>반품 진단 핵심 브리핑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@800&display=swap">
<style>
/* Layout: 한 화면 요약(헤드라인 → KPI 4 → 발견 4 카드 → 할 일 5) · 상세는 클릭 시 우측 드로어 */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#14181f; --ink-2:#4a5260; --ink-3:#7a8291; --rule:#dfe3ea; --rule-2:#eef1f5;

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s7:#4a3aa7; --gray:#b9bfc9;
  --crit:#c62f2f; --crit-soft:#fbeaea; --warn:#a86a00; --warn-soft:#fdf3e1; --good:#1d7a46; --scrim:rgba(15,18,24,.38);
  --f-display:"Noto Serif KR","Nanum Myeongjo",Georgia,serif; --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151b; --surface:#1a1e26; --ink:#eef1f6; --ink-2:#b8c0cc; --ink-3:#8a93a2; --rule:#2e3440; --rule-2:#232833;
  --accent:#7fa8ec; --accent-soft:#1f2b40; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s7:#9085e9; --gray:#555d6b;
  --crit:#ef6b6b; --crit-soft:#3a1f22; --warn:#e0a640; --warn-soft:#352a17; --good:#4fc283; --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1a1e26; --ink:#eef1f6; --ink-2:#b8c0cc; --ink-3:#8a93a2; --rule:#2e3440; --rule-2:#232833;
  --accent:#7fa8ec; --accent-soft:#1f2b40; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s7:#9085e9; --gray:#555d6b;
  --crit:#ef6b6b; --crit-soft:#3a1f22; --warn:#e0a640; --warn-soft:#352a17; --good:#4fc283; --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:24px 64px;display:grid;gap:22px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:8px 20px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.6vw,32px);margin:0;line-height:1.2}
.meta{color:var(--ink-3);font-size:12.5px}
.badge{display:inline-block;border:1px solid var(--crit);color:var(--crit);font-size:11.5px;padding:1px 7px;border-radius:3px;font-weight:500}
.headline{font-family:var(--f-display);font-weight:800;font-size:clamp(18px,2.5vw,23px);line-height:1.5;margin:0;text-wrap:balance}
.headline em{font-style:normal;color:var(--crit)}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink-3);margin:0 0 8px;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
button.card{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;cursor:pointer;display:grid;gap:4px;align-content:start;transition:border-color .15s, box-shadow .15s;min-width:0}
button.card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(20,40,90,.08)}
button.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k{font-size:12.5px;color:var(--ink-3)}
.v{font-family:var(--f-mono);font-size:clamp(22px,3vw,28px);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.v small{font-size:.5em;color:var(--ink-3);margin-left:2px}
.s{font-size:12.5px;color:var(--ink-2)}
.more{font-size:12px;color:var(--accent);font-weight:500;margin-top:4px}
.crit .v{color:var(--crit)}
.finds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.find{padding:16px 16px 10px}
.find .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.find h3{margin:0;font-size:16px}
.find .one{margin:2px 0 6px;font-size:13.5px;color:var(--ink-2)}
.tag{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:3px;background:var(--crit-soft);color:var(--crit)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.acts{display:grid;gap:6px}
button.act{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px}
.act .n{font-family:var(--f-mono);font-size:15px;color:var(--accent);font-weight:500}
.act .t{font-weight:700;font-size:14px}.act .d{font-size:12.5px;color:var(--ink-2)}
.act .amt{font-family:var(--f-mono);font-size:13px;text-align:right;white-space:nowrap}
.act .due{font-size:12px;color:var(--ink-3);text-align:right}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.foot button{font:inherit;font-size:12.5px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:5px 10px;cursor:pointer;color:var(--ink)}
.foot button:hover{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:var(--ink-2);margin:2px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend i.ln{height:2px;width:14px;vertical-align:3px}
svg text{font-family:var(--f-body)}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--bg);z-index:31;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 12px;border-bottom:1px solid var(--rule);background:var(--surface)}
.dh h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:800}
.dh button{font:inherit;font-size:13px;background:none;border:1px solid var(--rule);border-radius:4px;padding:4px 10px;cursor:pointer;color:var(--ink)}
.db{flex:1 1 auto;min-height:0;grid-auto-rows:max-content;overflow-y:auto;padding:16px 20px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
.db h3{margin:10px 0 0;font-size:15px}
.db p,.db li{font-size:14px;margin:0}
.db ul{margin:0;padding-left:18px;display:grid;gap:3px}
.box{background:var(--surface);border:1px solid var(--rule);padding:10px 12px;min-width:0}
.box .ct{font-size:13px;font-weight:700;margin:0}
.box .cs{font-size:11.5px;color:var(--ink-3);margin:0 0 4px}
.tbl{overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--rule-2);text-align:right;white-space:nowrap}
th{background:var(--rule-2);color:var(--ink-2);font-weight:500;font-size:12px}
td:first-child,th:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}
tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
tr.hi td{background:var(--crit-soft)}
.up{color:var(--good);font-weight:700}.dn{color:var(--crit);font-weight:700}
.note{font-size:12px;color:var(--ink-3)}
.judge{border-left:3px solid var(--accent);background:var(--accent-soft);padding:7px 11px;font-size:13.5px}
.judge b{color:var(--accent)}
.md{background:var(--surface);border:1px solid var(--rule);padding:16px 18px;font-size:14px}
.md h1{font-size:20px}.md h2{font-size:17px;margin-top:24px;border-top:1px solid var(--rule);padding-top:10px}.md h3{font-size:15px}
.md table{display:block;overflow-x:auto;margin:8px 0;border:1px solid var(--rule)}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--accent-soft)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:4px;line-height:1.5;z-index:40;max-width:260px;white-space:pre-line}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.finds{grid-template-columns:minmax(0,1fr)}
  button.act{grid-template-columns:24px minmax(0,1fr);row-gap:2px}.act .amt,.act .due{grid-column:2;text-align:left}}
@media (max-width:420px){.wrap{padding-inline:16px}.dh,.db{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<template id="d-rev" data-title="매출 착시 — 출고 기준 vs 실판매 기준">
<div class="judge"><b>→ 판단:</b> 출고 기준 매출의 15.0%(연 48.3억, 최근 12개월 57.1억)는 반품으로 지워지는 매출</div>
<ul><li>출고 기준 매출 = Σ(출고부수 × 공급단가)</li><li>실판매 기준 매출 = 출고 기준 매출 − 반품액</li><li>반품액 = 반품부수 × (거래처×시리즈) 출고 가중평균 공급단가</li><li>반품률 = 24개월 누적 반품 ÷ 누적 출고</li></ul>

<div class="legend"><span><i style="background:var(--s1)"></i>출고</span><span><i style="background:var(--s2)"></i>반품</span></div><div id="c-monthly"></div></div>
