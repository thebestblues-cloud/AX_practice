<title>반품 진단 핵심 브리핑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@800&display=swap">
<style>
/* Layout: 한 화면 요약(헤드라인 → KPI 4 → 발견 4 카드 → 할 일 5) · 상세는 클릭 시 우측 드로어 */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#14181f; --ink-2:#4a5260; --ink-3:#7a8291; --rule:#dfe3ea; --rule-2:#eef1f5;
  --accent:#1f4fa3; --accent-soft:#e6edf8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s7:#4a3aa7; --gray:#b9bfc9;
  --crit:#c62f2f; --crit-soft:#fbeaea; --warn:#a86a00; --warn-soft:#fdf3e1; --good:#1d7a46; --scrim:rgba(15,18,24,.38);
  --f-display:"Noto Serif KR","Nanum Myeongjo",Georgia,serif; --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151b; --surface:#1a1e26; --ink:#eef1f6; --ink-2:#b8c0cc; --ink-3:#8a93a2; --rule:#2e3440; --rule-2:#232833;
  --accent:#7fa8ec; --accent-soft:#1f2b40; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s7:#9085e9; --gray:#555d6b;
  --crit:#ef6b6b; --crit-soft:#3a1f22; --warn:#e0a640; --warn-soft:#352a17; --good:#4fc283; --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1a1e26; --ink:#eef1f6; --ink-2:#b8c0cc; --ink-3:#8a93a2; --rule:#2e3440; --rule-2:#232833;
  --accent:#7fa8ec; --accent-soft:#1f2b40; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s7:#9085e9; --gray:#555d6b;
  --crit:#ef6b6b; --crit-soft:#3a1f22; --warn:#e0a640; --warn-soft:#352a17; --good:#4fc283; --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:24px 64px;display:grid;gap:22px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:8px 20px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.6vw,32px);margin:0;line-height:1.2}
.meta{color:var(--ink-3);font-size:12.5px}
.badge{display:inline-block;border:1px solid var(--crit);color:var(--crit);font-size:11.5px;padding:1px 7px;border-radius:3px;font-weight:500}
.headline{font-family:var(--f-display);font-weight:800;font-size:clamp(18px,2.5vw,23px);line-height:1.5;margin:0;text-wrap:balance}
.headline em{font-style:normal;color:var(--crit)}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink-3);margin:0 0 8px;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
button.card{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;cursor:pointer;display:grid;gap:4px;align-content:start;transition:border-color .15s, box-shadow .15s;min-width:0}
button.card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(20,40,90,.08)}
button.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k{font-size:12.5px;color:var(--ink-3)}
.v{font-family:var(--f-mono);font-size:clamp(22px,3vw,28px);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.v small{font-size:.5em;color:var(--ink-3);margin-left:2px}
.s{font-size:12.5px;color:var(--ink-2)}
.more{font-size:12px;color:var(--accent);font-weight:500;margin-top:4px}
.crit .v{color:var(--crit)}
.finds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.find{padding:16px 16px 10px}
.find .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.find h3{margin:0;font-size:16px}
.find .one{margin:2px 0 6px;font-size:13.5px;color:var(--ink-2)}
.tag{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:3px;background:var(--crit-soft);color:var(--crit)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.acts{display:grid;gap:6px}
button.act{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px}
.act .n{font-family:var(--f-mono);font-size:15px;color:var(--accent);font-weight:500}
.act .t{font-weight:700;font-size:14px}.act .d{font-size:12.5px;color:var(--ink-2)}
.act .amt{font-family:var(--f-mono);font-size:13px;text-align:right;white-space:nowrap}
.act .due{font-size:12px;color:var(--ink-3);text-align:right}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.foot button{font:inherit;font-size:12.5px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:5px 10px;cursor:pointer;color:var(--ink)}
.foot button:hover{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:var(--ink-2);margin:2px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend i.ln{height:2px;width:14px;vertical-align:3px}
svg text{font-family:var(--f-body)}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--bg);z-index:31;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 12px;border-bottom:1px solid var(--rule);background:var(--surface)}
.dh h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:800}
.dh button{font:inherit;font-size:13px;background:none;border:1px solid var(--rule);border-radius:4px;padding:4px 10px;cursor:pointer;color:var(--ink)}
.db{overflow-y:auto;padding:16px 20px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
.db h3{margin:10px 0 0;font-size:15px}
.db p,.db li{font-size:14px;margin:0}
.db ul{margin:0;padding-left:18px;display:grid;gap:3px}
.box{background:var(--surface);border:1px solid var(--rule);padding:10px 12px;min-width:0}
.box .ct{font-size:13px;font-weight:700;margin:0}
.box .cs{font-size:11.5px;color:var(--ink-3);margin:0 0 4px}
.tbl{overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--rule-2);text-align:right;white-space:nowrap}
th{background:var(--rule-2);color:var(--ink-2);font-weight:500;font-size:12px}
td:first-child,th:first-child{text-align:left}
td.l,th.l{text-align:left;white-space:normal}
tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
tr.hi td{background:var(--crit-soft)}
.up{color:var(--good);font-weight:700}.dn{color:var(--crit);font-weight:700}
.note{font-size:12px;color:var(--ink-3)}
.judge{border-left:3px solid var(--accent);background:var(--accent-soft);padding:7px 11px;font-size:13.5px}
.judge b{color:var(--accent)}
.md{background:var(--surface);border:1px solid var(--rule);padding:16px 18px;font-size:14px}
.md h1{font-size:20px}.md h2{font-size:17px;margin-top:24px;border-top:1px solid var(--rule);padding-top:10px}.md h3{font-size:15px}
.md table{display:block;overflow-x:auto;margin:8px 0;border:1px solid var(--rule)}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--accent-soft)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:4px;line-height:1.5;z-index:40;max-width:260px;white-space:pre-line}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.finds{grid-template-columns:minmax(0,1fr)}
  button.act{grid-template-columns:24px minmax(0,1fr);row-gap:2px}.act .amt,.act .due{grid-column:2;text-align:left}}
@media (max-width:420px){.wrap{padding-inline:16px}.dh,.db{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<template id="d-rev" data-title="매출 착시 — 출고 기준 vs 실판매 기준">
<div class="judge"><b>→ 판단:</b> 출고 기준 매출의 15.0%(연 48.3억, 최근 12개월 57.1억)는 반품으로 지워지는 매출</div>
<ul><li>출고 기준 매출 = Σ(출고부수 × 공급단가)</li><li>실판매 기준 매출 = 출고 기준 매출 − 반품액</li><li>반품액 = 반품부수 × (거래처×시리즈) 출고 가중평균 공급단가</li><li>반품률 = 24개월 누적 반품 ÷ 누적 출고</li></ul>
<div class="tbl"><table>
<tr><th>지표</th><th>24개월 누적</th><th>연환산(÷2)</th><th>최근 12개월</th></tr>
<tr><td>출고부수</td><td>5,480,230</td><td>2,740,115</td><td>2,653,870</td></tr>
<tr><td>반품부수</td><td>847,259</td><td>423,630</td><td>491,718</td></tr>

<tr><td>출고 기준 매출</td><td>643.29억</td><td>321.65억</td><td>314.46억</td></tr>

<tr class="sum"><td>실판매 기준 매출</td><td>546.75억</td><td>273.38억</td><td>—</td></tr>
</table></div>

<div class="legend"><span><i style="background:var(--s1)"></i>출고</span><span><i style="background:var(--s2)"></i>반품</span></div><div id="c-monthly"></div></div>

| 재판매 불가(제작원가 전액 소실) | **개정판교체, 파본** | 반품부수 × 제작원가_원부 = 폐기 제작원가 |

| 연환산 | 24개월 합계 ÷ 2 | 최근 12개월(2025) 값은 괄호 병기 |

- 반품 1부당 손실 공식
  - 재판매 가능 사유: **1,400원**
  - 재판매 불가 사유: **1,400원 + 제작원가_원부**
- 물류비 외 외부 가정값 없음. 창고비·폐기 처리비·인세는 데이터에 없어 미반영

## ① 모듈 1 [개념] 출고 기준 매출과 실판매 기준 매출 — [학습자 워크북]

### 학습목표
- 출고 기준 매출과 실판매 기준 매출을 정의식으로 구분 (목표 1)

### 개념

> **출고 기준 매출 = 출고부수 × 공급단가**
> **실판매 기준 매출 = (출고부수 − 반품부수) × 공급단가**

- 위탁 거래에서 출고는 "거래처 창고로 옮긴 것"이지 "팔린 것"이 아님
- 팔리지 않은 책은 몇 개월 뒤 반품으로 돌아오고, 그때 매출이 지워짐
- 반품은 출고 후 시차를 두고 발생(우리 데이터: 첫 출고 후 최소 2개월, 중앙값 4개월)

### 용어 정리

| 용어 | 뜻 | 이 교재에서 쓰는 값 |
|---|---|---|
| 위탁 공급 | 거래처가 팔지 못한 책을 되돌려 보낼 수 있는 공급 방식 | 12개사 전부 |
| 공급단가 | 거래처에 넘긴 1부당 단가(정가 아님) | 출고 데이터의 공급단가_원부 |
| 공급률 | 공급단가 ÷ 정가(출고부수 가중) | 전사 67.31% |
| 반품 시차 | 출고와 반품 입고 사이의 개월 수 | 최소 2개월 · 중앙값 4개월 |
| 반품액 | 반품부수 × 그 거래처·시리즈의 출고 가중평균 공급단가 | 24개월 96.54억원 |
| 재판매 불가 반품 | 다시 팔 수 없어 제작원가가 소실되는 반품 | 개정판교체 · 파본(모듈 0) |

### 반품액은 어떻게 계산하나
- 반품 데이터에는 단가가 없음 → 같은 거래처·같은 시리즈로 나간 출고분의 가중평균 공급단가를 붙임
- 예: 한솔북센이 24개월간 받아 간 전 시리즈의 출고액 ÷ 출고부수 = 평균 공급단가 11,263원
- 거래처 단위 평균과 시리즈 단위 평균을 섞어 쓰면 같은 반품이 다른 금액으로 계산됨 → 기준 하나만 사용

### 숫자 읽는 법 3원칙
1. 출고는 "옮긴 것", 실판매는 "남은 것" — 성과는 남은 것으로 본다
2. 반품률은 누적으로 본다 — 당월 값은 시차 때문에 요동친다
3. 손실은 두 겹이다 — 지워지는 매출(매출 착시)과 실제로 나가는 돈(현금 손실)을 구분한다

### 전사 24개월 실적(2024-01~2025-12)

| 지표 | 값 |
|---|---|
| 누적 출고부수 | 5,480,230부 |
| 누적 반품부수 | 847,259부 |
| 실판매부수 | 4,632,971부 |
| 반품률¹ | **15.46%** |
| 출고 기준 매출 | 643.29억원 |
| 반품액 | 96.54억원 |
| 실판매 기준 매출 | **546.75억원** |
| 차액(매출 착시) | 96.54억원 → 연 48.3억원(24개월 ÷ 2) · 최근 12개월 57.1억원 |

¹ 반품률 분모 = 24개월 누적 출고부수(누적 기준). 당월 출고를 분모로 쓰지 않음

### 한 장 도표 — 출고 기준 보고서가 실제보다 좋아 보이는 이유

| 단계 | 2024년 | 2025년 | 증감 |
|---|---|---|---|
| ① 출고 기준 매출 | 328.83억 | 314.46억 | −4.4% |
| ② 그해 입고된 반품액 | −39.48억 | −57.06억 | +44.5% |
| ③ 실판매 기준 매출(①−②) | 289.35억 | 257.40억 | **−11.0%** |
| ④ 반품 왕복 물류비(1,400원/부) | −4.98억 | −6.88억 | +38.3% |
| ⑤ 폐기 제작원가(개정판교체+파본) | −6.07억 | −10.50억 | +73.0% |

- 출고 기준으로는 −4.4%, 실판매 기준으로는 −11.0% — 같은 1년이 두 배 이상 나쁘게 읽힘
- 출고 매출 보고서에는 ②·④·⑤가 나타나지 않음
- 주의: 2024년 초 출고분 반품이 2024년 3월부터 입고되므로 2024년 반품은 과소 관측(시차 편향). 증감률은 방향 확인용, 판단은 누적 기준으로

### 핵심 정리
- 출고 기준 643.29억 중 96.54억은 반품으로 지워진 매출, 남은 것은 546.75억
- 반품률 15.46%는 24개월 누적 기준. 연도별 비교는 시차 편향 때문에 방향 확인용으로만

### 발문 1. 표 A-1에서 당월 반품률과 누적 반품률은 각각 어떻게 움직이는가?

**해설**
- 당월 반품률: 9.5%(2024-03) ~ 90.8%(2025-10)로 요동. 출고가 많은 달(2·3·8월)은 분모가 커져 낮고, 개정판 직후 달(2024-05·06, 2025-05, 2025-10)은 반품이 몰려 높음
- 당월 반품률이 요동치는 이유: 당월 반품은 과거 몇 개월 전 출고분에서 오는데 분모는 당월 출고 → 분자·분모의 시점 불일치
- 누적 반품률: 2025-04 이후 33.4~38.0% 범위에서 고정 → 일시 현상이 아니라 구조
- 계산: 381,708 ÷ 1,014,080 = 37.64%

### 발문 2. 표 A-2에서 출고 1위 거래처는 실판매 기준으로도 1위인가? 차이는 어디서 오는가?

**해설**
- 아님. 한솔북센은 출고 기준 1위 → 실판매 기준 3위(▼2)
- 실판매 기준 매출 = 114.21억 − 반품액 42.46억 = 71.75억
- 대명서적유통: 103.90억 − 13.61억 = 90.29억 → 1위
- 원인은 반품률: 한솔북센 37.64% vs 한솔북센 자신을 제외한 11개사 가중평균 10.42%(3.61배). 자기 포함 전사 평균 15.46%와 비교하면 2.43배
- 초과 반품부수 = 381,708 − 1,014,080 × 10.42% = 276,000부(24개월)
- 초과 반품이 지우는 매출 = 276,000 × 평균 공급단가 11,263원 = 31.1억 → 연 15.5억원(24개월 ÷ 2)

### 핵심 정리
- 출고 1위가 실판매 1위는 아님. 순위는 반품률이 바꾼다
- 비교는 항상 "자기 제외 평균"으로. 자기를 포함하면 고반품 거래처가 평균을 끌어올려 배수가 작아 보임(3.61배 → 2.43배)
- 구조인지 일시인지는 누적 반품률이 멈춘 자리로 판단

- 합계 14억 7,660만원(24개월, 6종) → 연 7.4억원(24개월 ÷ 2)
- 여기에 반품액(매출 착시)은 별도 — 출고 시점에 매출로 잡혔던 금액이 3개월 뒤 사라짐

### 발문 1. 표 B-1에서 M-3~M-1 출고는 평상시와 비교해 어떤가? 어느 거래처가 많이 받아 갔는가?

**해설**
- 6종 합산 평상시의 4.60배(무출고 월 포함 평균 기준 5.44배). 가장 낮은 기출정복 영어 고1도 3.12배
- 특정 시리즈가 아니라 6종 모두에서 반복 → 관행
- 거래처별 구간 출고: 한솔북센 274,190부(33.1%), 대명서적유통 200,260부(24.2%), 북웨이브몰 141,950부(17.1%), 남강교재총판 128,930부(15.6%)
- 한솔북센의 같은 6종 평상시 비중은 20.1% → 구간에서 +13.0%p. 모듈 2의 고반품 거래처와 같은 곳 → 하나의 구조

### 발문 2. 개념단단 영어 중1의 구판 반품 1부는 얼마의 현금을 잃게 하는가?

**해설**
- 제작원가_원부 5,480원(도서마스터)
- 개정판교체 반품 1부 = 1,400 + 5,480 = **6,880원**
- 같은 시리즈 개정판교체 43,307부 × 6,880원 = 2억 9,795만 2,160원
- 같은 1부가 기간만료(재판매 가능)로 돌아왔다면 1,400원 → 사유에 따라 손실이 4.9배 차이

### 핵심 정리
- 개정판 직전 3개월 구판 출고는 평상시의 4.6배, 그 구간 반품률은 36.9%
- 구판 반품 1부 = 물류비 + 제작원가 이중 손실. 사유가 기간만료였다면 물류비만
- 구판 물량을 가장 많이 받아 간 곳과 반품률이 가장 높은 곳이 같은 거래처 — 두 문제를 따로 풀지 않음

## ⑤ 모듈 5 [현장 적용] 거래처 상담 스크립트 — [학습자 워크북]

> 이 스크립트는 거래처 앞에서 실제로 말하는 문서. **타 거래처 실명·개별 수치 언급 금지.** 비교는 "전체 12개사" "귀사 제외 11개사 평균" 같은 익명 집계로만
> 아래 수치는 반품률 상위 거래처 상담용 예시값. 다른 거래처에는 같은 산식에 그 거래처 값을 넣어 사용

### 스크립트 사용 원칙
- 숫자는 거래처 자신의 값과 익명 집계(귀사 제외 11개사 평균, 전체 12개사 평균)만 사용
- 모든 반론 대응은 계산값 1개 이상으로. "업계가 원래 그렇다"는 대응으로 쓰지 않음
- 원인은 묻고, 단정하지 않음. 데이터가 보여 주는 것은 "얼마나"이지 "왜"가 아님
- 제안 조건의 숫자(30%·25%·0.5%p·700원)는 본부 승인 범위. 범위 밖 양보는 그 자리에서 확답하지 않고 본부 협의 후 회신

### 도입 멘트
"오랫동안 함께해 주셔서 감사합니다. 오늘은 지난 24개월 거래를 숫자로 같이 보고, 양쪽 모두 비용을 줄일 수 있는 방법을 말씀드리려고 합니다. 귀사의 판매를 줄이자는 이야기가 아니라, 왕복으로 오가는 물량을 줄이자는 이야기입니다."

### 데이터 제시 순서
1. 귀사 거래 현황: 24개월 출고 1,014,080부, 반품 381,708부, 실판매 632,372부
2. 귀사 반품률 37.6% vs 귀사 제외 11개사 가중평균 10.4%
3. 개정판 직전 구간을 빼고 봐도 귀사 반품률 31.0% — 시즌·개정판만의 문제가 아님
4. 반품 1부가 양쪽에 남기는 비용: 왕복 물류(당사 기준 1,400원/부 가정) + 재판매 불가분 폐기
5. 제안 조건 2개 → 의견 청취

### 제안 조건 1 — 반품률 상한 목표와 인센티브
- 2026년 상반기 누적 반품률 30% 이하, 하반기 25% 이하(반기별 반품 전표 부수 ÷ 출고 전표 부수, 양사 전표로 상호 확인)
- 달성 시 다음 반기 공급률 0.5%p 인하
- 근거: 25% 달성 시 반품 연 약 6.4만부 감소(현재 37.6% 대비, 연 출고 507,040부 기준) → 당사 물류·폐기 절감 연 약 2.0억원. 인센티브 비용은 연 약 0.44억원(최근 1년 정가 출고액 87.55억 × 0.5%p) → 절감액 범위 안

### 제안 조건 2 — 반품 물류비 분담
- 상한 초과 반품 1부당 700원 정액 분담(모듈 0 왕복 물류비 1,400원의 50%)
- 정액 단가로 계약에 명시 → 귀사가 반품 전표 부수만으로 검증 가능
- 현재 수준(37.6%)이 25% 상한 대비 유지될 경우 초과분 연 약 6.4만부 × 700원 = 약 0.45억원

### 예상 반론 3개와 대응

**반론 1. "반품이 많은 건 출판사가 개정판 직전에 물량을 밀어서 그런 것 아닌가요?"**
- 대응: "일부 맞습니다. 그래서 당사도 개정판 직전 3개월 출고 상한을 함께 도입합니다. 다만 그 구간을 빼고 계산해도 귀사 반품률은 31.0%로, 전체 거래처 평균(귀사 제외 10.4%)의 약 3배입니다. 개정판 구간 조정과 평상시 반품 관리를 함께 해야 숫자가 내려갑니다."

**반론 2. "참고서는 시즌 상품이라 반품이 많을 수밖에 없습니다."**
- 대응: "같은 시리즈, 같은 시즌을 다루는 나머지 11개사의 가중평균 반품률이 10.4%입니다. 시즌 요인은 모든 거래처에 같게 작용하니, 37.6%와 10.4%의 차이는 시즌만으로 설명되지 않습니다."

**반론 3. "물류비를 나누면 주문량을 줄일 수밖에 없습니다."**
- 대응: "주문량이 20% 줄고 반품률이 25%로 내려가면, 귀사 실판매는 연 316,186부에서 304,224부로 3.8% 줄지만 왕복 반품 물량은 연 190,854부에서 101,408부로 47% 줄어듭니다. 판매는 거의 그대로이고 오가는 물량만 절반 가까이 줄어드는 구조입니다."
  - 계산: 연 출고 507,040부 × 0.8 = 405,632부, × (1 − 0.25) = 304,224부, × 0.25 = 101,408부

### 상담 중 하지 말아야 할 말
- 타 거래처 실명·개별 반품률·개별 거래액("○○총판은 10%인데…") — 익명 집계만
- 원인 단정("귀사 매대 관리가 문제") — 데이터에 원인 없음. "확인해 보고 싶다"로 질문
- 계약서에 없는 조항 인용("약정상 반품 상한이 있다") — 원본 확인 전 사용 금지
- 확정되지 않은 금액 약속("인센티브 바로 드리겠다") — 제안 조건은 본부 승인 범위 안에서만
- 물류비 1,400원을 "실제 비용"으로 표현 — 가정값임을 밝히고, 분담은 정액 700원으로 제시

### 마무리 멘트
"오늘 말씀드린 숫자는 귀사 전표와 당사 전표로 함께 확인할 수 있는 값입니다. 상한 목표는 귀사 판매를 줄이자는 것이 아니라 왕복 물량을 줄이자는 것이고, 달성하시면 공급률로 돌려드리는 구조입니다. 검토하신 뒤 회신 주시면, 필요한 자료는 월별로 정리해 드리겠습니다."

### 합의 가능한 조건 범위와 하한선 [강사·영업사원 내부 참고 — 거래처에 보이지 않음]

- **손익분기 반품률**(실판매 기준 공헌이 0이 되는 반품률)

> 출고 1부당 공헌 = (1 − r) × (p − c) − r × (L + d × c)
> 손익분기 r* = (p − c) ÷ (p − c + L + d × c)
> p 평균 공급단가 · c 평균 제작원가 · L 물류비 1,400원(모듈 0) · d 반품 중 재판매 불가 비중(모듈 0 규칙)

- 대상 거래처 값: p 11,263원 · c 5,877원 · d 29.5%(개정판교체+파본 112,587 ÷ 381,708)
  - r* = 5,386 ÷ (5,386 + 1,400 + 0.295 × 5,877) = **63.2%**
  - 전사 값(p 11,738원 · c 5,882원 · d 33.1%): r* = 63.6%

### 오프닝 스크립트
"오늘 화면에 나오는 숫자는 전부 우리 회사의 지난 24개월 실제 데이터입니다. 예시용으로 만든 숫자는 하나도 없습니다. 우리가 2년 동안 출고한 책은 548만 부, 그중 85만 부가 돌아왔습니다. 출고 보고서에는 643억이 찍혀 있지만 실제로 남은 매출은 547억입니다. 96억은 보고서에만 있던 매출입니다. 오늘 60분은 누구를 탓하는 시간이 아니라, 이 숫자를 읽는 법을 같이 익히는 시간입니다."

### 예상 질문 3개와 답변

**Q1. 반품이 출고 후 몇 달 뒤에 오는데, 반기 평가면 제 출고분 반품이 다음 사람 실적에 잡히지 않나요?**
- 답: 그래서 평가는 반기 누적이고, 직전 반기 출고분 반품까지 반영해 정산합니다. 우리 데이터에서 거래처·시리즈별 첫 출고→첫 반품 간격은 최소 2개월, 중앙값 4개월입니다. 반기 정산에 직전 반기 출고분 반품을 포함하는 이유입니다.

**Q2. 반품률 높은 거래처는 거래를 줄이라는 뜻인가요?**
- 답: 아닙니다. 반품률 37.6% 거래처도 손익분기 63.2%보다 낮아 거래 자체는 흑자입니다. 줄이자는 것은 거래가 아니라 왕복 물량입니다. 1부당 공헌이 2,179원에서 3,256원(반품률 25%)으로 오르는 방향을 찾자는 것입니다.

**Q3. 물류비 1,400원은 정확한 값인가요?**
- 답: 아닙니다. 회수 운송·검품·재입고를 합친 가정값이고 참고 범위는 1,000~1,800원입니다. 물류팀 실제 단가가 나오면 모듈 0 한 곳만 바꾸면 교재 전체가 그 값으로 다시 계산됩니다.

### 오해하기 쉬운 지점 2개

1. **반품률 분모는 누적 출고** — 당월 반품 ÷ 당월 출고로 계산하면 한솔북센 2025-10은 90.8%, 2024-03은 9.5%처럼 요동. 판단은 누적(37.6%)으로. 당월 값은 "어느 달에 반품이 몰렸나"를 보는 용도
2. **월별 반품률은 100%를 넘을 수 있음** — 반품은 과거 출고분에서 오므로 출고가 거의 없는 달에 반품이 몰리면 100% 초과 가능. 오류가 아니라 시차의 결과. 우리 데이터에서 전사·거래처 단위 월별 값은 최고 90.8%(한솔북센 2025-10)였지만, 시리즈×월 단위로 보면 반품 발생 295건 중 108건이 100% 초과(최고 개념단단 영어 중1 2025-04, 370.3%)

- 모듈 0: "이 교재에서 가정은 하나뿐"을 먼저 못박기. 물류비가 바뀌면 어디가 바뀌는지(모듈 3·4·5) 손으로 짚어 주기
- 모듈 1: 한 장 도표에서 ①과 ③의 증감률(−4.4% vs −11.0%)을 나란히 판서. 2024년 반품 과소 관측 주의를 반드시 덧붙이기

 P.forEach((p,i)=>{const y=f.mt+i*bh;const w=p.rate/max*f.iw;const c=p.n==='한솔북센'?css('--crit'):css('--s1');

  const t=el('text',{x:x+4,y:f.mt+56,'font-size':11.5,fill:css('--ink')},f.svg);t.textContent=`${n} ${v.toFixed(1)}억`;x+=w+2})}


(()=>{let cs=0,cr=0;D.hs.forEach(d=>{cs+=d.ship;cr+=d.ret;d.rate=d.ship?d.ret/d.ship:0;d.cum=cs?cr/cs:0})})();

addEventListener('keydown',e=>{if(e.key==='Escape'&&cur)closeD()});
